name: 组件问题
description: 报告可复现的组件或工作台问题
title: "[组件] "
body:
  - type: input
    id: component
    attributes:
      label: 验收编号或公开 API
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本、系统和浏览器或模拟器
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期和实际结果
    validations:
      required: true
